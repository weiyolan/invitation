name: Deploy to GitHub Pages

# Publishes index.html (at repo root) to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source = "GitHub Actions".
on:
  push:
    branches:
      - main
      - claude/shader-background-mobile-gestures-5hl3pj   # go live from the working branch too (no merge needed)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'          # default is _site/ — publish the repo root instead
      - id: deployment
        uses: actions/deploy-pages@v4
